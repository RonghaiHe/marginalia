<linkset>
  <html:link rel="localization" href="marginalia-preferences.ftl" />
</linkset>
<groupbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })">
  <!-- Provider Selection -->
  <html:fieldset id="marginalia-provider-section">
    <html:legend data-l10n-id="pref-provider-section"></html:legend>
    <hbox align="center">
      <html:label for="marginalia-provider" style="width: 120px" data-l10n-id="pref-provider-label"></html:label>
      <html:select id="marginalia-provider" preference="extensions.zotero.marginalia.provider"
        style="flex: 1; max-width: 260px">
        <html:option value="openai" data-l10n-id="pref-provider-openai"></html:option>
        <html:option value="copilot" data-l10n-id="pref-provider-copilot"></html:option>
      </html:select>
    </hbox>
  </html:fieldset>

  <!-- OpenAI-Compatible API Configuration Section -->
  <html:fieldset id="marginalia-openai-section">
    <html:legend data-l10n-id="pref-api-config"></html:legend>
    <hbox align="center">
      <html:label for="marginalia-apiUrl" style="width: 120px" data-l10n-id="pref-api-url"></html:label>
      <html:input type="text" id="marginalia-apiUrl" preference="extensions.zotero.marginalia.apiUrl"
        style="flex: 1; min-width: 400px" data-l10n-id="pref-api-url-input" />
    </hbox>
    <hbox align="center">
      <html:label for="marginalia-apiKey" style="width: 120px" data-l10n-id="pref-api-key"></html:label>
      <html:input type="password" id="marginalia-apiKey" preference="extensions.zotero.marginalia.apiKey"
        style="flex: 1; min-width: 400px" />
    </hbox>
    <hbox align="center">
      <html:label for="marginalia-model" style="width: 120px" data-l10n-id="pref-model"></html:label>
      <html:input type="text" id="marginalia-model" preference="extensions.zotero.marginalia.model"
        style="flex: 1; min-width: 400px" data-l10n-id="pref-model-input" />
    </hbox>
    <hbox align="center" style="
        margin-top: 4px;
        padding: 8px;
        background: #f0f7ff;
        border-radius: 6px;
        border: 1px solid #c2ddf7;
      ">
      <html:input type="checkbox" id="marginalia-enableVision" preference="extensions.zotero.marginalia.enableVision"
        style="margin-right: 6px" />
      <html:label for="marginalia-enableVision" data-l10n-id="pref-enable-vision"
        style="color: #1a6fba; font-weight: 600; margin-right: 8px"></html:label>
      <html:span data-l10n-id="pref-enable-vision-hint" style="color: #888; font-size: 11px"></html:span>
    </hbox>
    <hbox style="gap: 12px; margin-top: 4px">
      <button id="marginalia-test-connection" data-l10n-id="pref-test-connection" />
      <button id="marginalia-save-settings" data-l10n-id="pref-save" />
    </hbox>
  </html:fieldset>

  <!-- GitHub Copilot Section -->
  <html:fieldset id="marginalia-copilot-section" style="display: none">
    <html:legend data-l10n-id="pref-copilot-settings"></html:legend>
    <hbox align="center" style="margin-bottom: 8px">
      <html:label style="width: 120px; font-weight: 600" data-l10n-id="pref-copilot-status-label"></html:label>
      <html:span id="marginalia-copilot-status" data-l10n-id="pref-copilot-status-not-loggedin" style="color: #888">
      </html:span>
    </hbox>
    <hbox style="gap: 12px; margin-bottom: 8px">
      <button id="marginalia-copilot-login" data-l10n-id="pref-copilot-login" />
      <button id="marginalia-copilot-logout" data-l10n-id="pref-copilot-logout" />
    </hbox>
    <hbox align="center">
      <html:label for="marginalia-copilotModel" style="width: 120px" data-l10n-id="pref-copilot-model-label">
      </html:label>
      <html:select id="marginalia-copilotModel" preference="extensions.zotero.marginalia.copilotModel"
        style="flex: 1; max-width: 260px">
        <html:option value="gpt-5-mini" data-l10n-id="model-gpt-5-mini">GPT-5 mini</html:option>
        <html:option value="gpt-4o" data-l10n-id="model-gpt-4o">GPT-4o</html:option>
        <html:option value="gpt-4.1" data-l10n-id="model-gpt-4.1">GPT-4.1</html:option>
        <!-- <html:option value="raptor-mini" data-l10n-id="model-raptor-mini">Raptor mini</html:option> -->
        <html:option value="claude-haiku-4.5" data-l10n-id="model-claude-haiku-4.5">Claude Haiku 4.5</html:option>
        <html:option value="gemini-3-flash" data-l10n-id="model-gemini-3-flash">Gemini 3 Flash</html:option>
        <!-- <html:option value="gpt-5.4-mini" data-l10n-id="model-gpt-5.4-mini">GPT-5.4 mini</html:option> -->
        <html:option value="gemini-2.5-pro" data-l10n-id="model-gemini-2.5-pro">Gemini 2.5 Pro</html:option>
        <!-- <html:option value="gemini-3.1-pro" data-l10n-id="model-gemini-3.1-pro">Gemini 3.1 Pro</html:option> -->
      </html:select>
    </hbox>
  </html:fieldset>

  <!-- Chat Settings Section -->
  <html:fieldset>
    <html:legend data-l10n-id="pref-chat-settings"></html:legend>
    <hbox align="center">
      <html:label for="marginalia-maxHistoryRounds" style="width: 130px" data-l10n-id="pref-max-history-rounds">
      </html:label>
      <html:input type="number" id="marginalia-maxHistoryRounds"
        preference="extensions.zotero.marginalia.maxHistoryRounds" min="1" max="100" value="20" style="width: 60px" />
    </hbox>
    <hbox align="start">
      <html:label for="marginalia-systemPrompt" style="width: 120px; margin-top: 8px" data-l10n-id="pref-system-prompt">
      </html:label>
      <html:textarea id="marginalia-systemPrompt" preference="extensions.zotero.marginalia.systemPrompt" style="
          flex: 1;
          height: 100px;
          padding: 8px;
          border: 1px solid #d1d1d6;
          border-radius: 4px;
          font-family: monospace;
          font-size: 12px;
        " data-l10n-id="pref-system-prompt-input"></html:textarea>
    </hbox>
  </html:fieldset>
</groupbox>
<vbox>
  <html:label data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'></html:label>
</vbox>
